services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codesaga
      POSTGRES_USER: codesaga
      POSTGRES_PASSWORD: codesaga_local
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - codesaga_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codesaga -d codesaga']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codesaga_postgres:
